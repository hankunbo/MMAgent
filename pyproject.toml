[project]
name = "mmagent"
version = "0.0.0"
description = "Goal-driven executable clinical evidence graph research framework"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector==0.5.0",
    "lxml==6.1.3",
    "defusedxml==0.7.1",
    "beautifulsoup4==4.15.0",
    "pypdf==6.17.0",
    "fastapi==0.141.1",
    "uvicorn==0.38.0",
    "Pillow>=10,<13",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "Algorithm_Tool",
    "Seg_Model",
    "algorithm-capability-db",
    "Total_graph_step_planner",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
