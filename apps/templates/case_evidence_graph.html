<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; connect-src 'none'">
<title>__TITLE__</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f8;color:#223449;font:15px/1.7 system-ui,sans-serif}header{background:#123b4d;color:white;padding:22px 30px}h1{margin:0;font-size:25px}.toolbar{display:flex;gap:12px;padding:12px 24px;background:white;flex-wrap:wrap}button,input,select{font:inherit;padding:6px 10px;border:1px solid #becdd6;border-radius:5px}button{cursor:pointer;background:#fff;color:#164c63}main{display:grid;grid-template-columns:39% 61%}nav{padding:12px;max-height:83vh;overflow:auto;border-right:1px solid #ccd8e2}article{padding:22px;background:white;max-height:83vh;overflow:auto}ul{list-style:none;padding-left:18px;border-left:1px solid #d6e1e8}nav>ul{padding-left:0;border:0}summary{cursor:pointer}li{margin:6px 0}.node{border:0;text-align:left;padding:2px;background:transparent}.active{background:#e2f1f5}.badge{border-radius:5px;background:#ecf1f5;color:#496174;font-size:12px;padding:2px 5px;margin-left:6px}.done{background:#d9f1e5;color:#236442}.card{padding:13px;margin:10px 0;border:1px solid #dae3e8;border-radius:8px}h2{margin-top:0}h3{border-bottom:1px solid #dce5eb;padding-bottom:5px}.muted{font-size:13px;color:#627488}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f4f7f9;padding:12px;max-height:380px;overflow:auto}img{max-width:100%;max-height:480px;object-fit:contain;background:#111}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e2e8ed;padding:7px}a{color:#146681}.pictures{display:grid;grid-template-columns:1fr 1fr;gap:12px}footer{padding:14px 24px;color:#627488;font-size:12px}@media(max-width:800px){main{display:block}nav{max-height:40vh}article{max-height:none}.pictures{grid-template-columns:1fr}}
</style></head><body>
<header><h1>__TITLE__</h1><div id="summary"></div><div>测量与模型结果按节点展示；青光眼结论单列为“待判读”。</div></header>
<div class="toolbar"><input id="search" placeholder="搜索节点、工具、结果"><select id="filter"><option value="">全部状态</option></select><button id="overview">病例总览</button><button id="expand">展开</button><button id="collapse">折叠</button><button id="download">下载完整JSON</button></div>
<main><nav id="tree"></nav><article id="detail"></article></main>
<footer>同一病例的实测快照。Knowledge来源、工具调用、Runtime产物和节点关系均可展开查看；无页面外部请求。</footer>
<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('snapshot').textContent),C=D.case_evidence;
const tree=document.getElementById('tree'),detail=document.getElementById('detail'),byKey=new Map(D.nodes.map(n=>[n.key,n]));let active=null;
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function block(p,label,v){const d=el('details');d.append(el('summary',label),el('pre',JSON.stringify(v,null,2)));p.append(d)}
function heading(t){detail.append(el('h3',t))}
function acquisition(parent,a){if(!a)return;const card=el('section',undefined,'card');card.append(el('strong','取证路径 · '+a.label),el('p','所需输入：'+a.required_input),el('p',a.reason));if(a.fields){for(const [name,v] of Object.entries(a.fields))card.append(el('p',name+'：'+(typeof v==='string'?v:v.label)))}if(a.model_candidate){const m=a.model_candidate;card.append(el('strong',m.name),el('p','具体权重：'+m.weight_file+' · '+m.weight_size+'字节'),el('p','公开权重已找到，本机尚未安装验证。'));for(const [label,url] of [['GitHub项目',m.github],['官方权重',m.weight_repository]]){if(url.startsWith('https://')){const link=el('a',label);link.href=url;link.target='_blank';link.rel='noopener noreferrer';card.append(link,el('br'))}}block(card,'模型与权重的精确版本',m)}block(card,'取证分类字段',a);parent.append(card)}
function acquisitionOverview(){heading('当前输入下的取证安排');detail.append(el('p','本例：单张SLO。已提供字段显示实际值；未提供且无法取得的检查本轮跳过。'));const labels={observed:'已有工具结果',observed_fields:'逐字段结果',visual_observation:'已完成助手图像观察',visual_review_pending:'待图像观察',tool_build_candidate:'可补工具：已有明确项目和权重',unavailable_current_input:'当前输入无法取证',algorithm_pending:'可用现有图像：算法待接入',partial_observation:'部分已有：补充分量另列'};const keys=D.acquisition_requirements||[];for(const [category,label] of Object.entries(labels)){const items=keys.map(k=>byKey.get(k)).filter(n=>n.patient_evidence.acquisition.category===category);if(!items.length)continue;detail.append(el('h3',label+'（'+items.length+'项）'));for(const n of items){const a=n.patient_evidence.acquisition,b=el('button',n.title+'：'+a.reason);b.onclick=()=>show(n.key);detail.append(b,el('br'))}}block(detail,'输入范围和分类策略',D.acquisition_policy)}
function badge(s){return el('span',s,'badge'+(s==='已有结果'?' done':''))}
function picture(p,key){const data=C.images[key==='fovea_position'?'input':key];if(!data)return;const d=el('div');d.append(el('p',({input:'本例原图',vessel_mask:'血管分割',artery_mask:'动脉分割',vein_mask:'静脉分割',disc_mask:'SLOctolyzer视盘',segman_overlay:'SegMAN-B叠加图',segman_cup:'SegMAN-B视杯',segman_rim:'SegMAN-B盘沿',segman_disc:'SegMAN-B视盘',fovea_position:'中央凹模型坐标'})[key]||key));if(key==='fovea_position'){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg'),im=document.createElementNS(ns,'image'),dot=document.createElementNS(ns,'circle'),[h,w]=C.input.dimensions,[x,y]=C.results.fovea.observation.model.fovea_xy;svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.style.maxHeight='480px';svg.style.width='100%';im.setAttribute('href',data);im.setAttribute('width',w);im.setAttribute('height',h);dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('r','10');dot.setAttribute('fill','none');dot.setAttribute('stroke','#ffcc33');dot.setAttribute('stroke-width','3');svg.append(im,dot);d.append(svg)}else{const im=el('img');im.src=data;im.alt=key;d.append(im)}p.append(d)}
function metrics(p,rows){if(!rows.length)return;const table=el('table'),head=el('tr');['观察/指标','实测结果','单位'].forEach(s=>head.append(el('th',s)));table.append(head);for(const r of rows){const tr=el('tr');tr.append(el('td',r.name),el('td',r.value===null?(r.missing_reason||'未测得'):(Array.isArray(r.value)?r.value.join(', '):String(r.value))),el('td',r.unit||''));table.append(tr)}p.append(table)}
function sources(n){heading('证据来源');for(const id of n.egs_sources){const p=D.egs_pages.find(v=>v.id===id),card=el('section',undefined,'card');card.append(el('strong',p.title),el('p',p.binding.interpretation));const a=el('a','查看EGS原文');a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';card.append(a);for(const c of p.chunks.filter(c=>c.text.length>100&&p.binding.terms.some(t=>c.text.toLowerCase().includes(t)))){const d=el('details');d.append(el('summary','原文片段 · '+c.position.kind+' #'+c.position.ordinal),el('p',c.text));block(d,'引用与位置',c);card.append(d)}detail.append(card)}for(const e of n.knowledge){const c=e.chunk_ref&&D.source_chunks.find(c=>c.ref.checksum===e.chunk_ref.checksum);{const d=el('section',undefined,'card');d.append(el('p',c?c.text:(e.scope||e.kind)));if(e.page_id){const p=D.historical_pages.find(p=>p.id===e.page_id);if(p&&p.url.startsWith('https://')){const a=el('a','查看引用网页');a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';d.append(a)}}block(d,'来源位置和版本',e);detail.append(d)}}if(!n.knowledge.length&&!n.egs_sources.length)detail.append(el('p','来源：下列工具实现及其输入/输出记录。','muted'))}
function show(key){active=key;render();const n=byKey.get(key),p=n.patient_evidence;detail.replaceChildren();detail.append(el('h2',n.title),badge(p.status),el('p',p.summary));if(p.next_action)detail.append(el('p','下一步：'+p.next_action));acquisition(detail,p.acquisition);heading('本例结果');metrics(detail,p.results);const imgs=el('div',undefined,'pictures');p.images.forEach(k=>picture(imgs,k));detail.append(imgs);if(p.tool)block(detail,'组件调用来源',p.tool);if(p.observation_source)block(detail,'助手图像观察来源',p.observation_source);for(const code of p.artifact_codes){const a=[C.input,...C.artifacts].find(a=>a.asset_code===code);if(a)block(detail,(a.database_persisted===false?'本地产物（待入库） · ':'已入库产物 · ')+a.artifact_type_code,a)}if(key==='MODEL_ASSESSMENT')block(detail,'分类原始输出及来源',C.fairclip);if(p.children?.length){heading('子项进度');for(const c of p.children){const b=el('button',c.title+' · '+c.status);b.onclick=()=>show(c.key);detail.append(b,el('br'))}}sources(n);heading('工具及关系');block(detail,'可用工具绑定',n.tools);for(const e of D.relationships.filter(e=>e.parent===key||e.child===key)){const card=el('div',undefined,'card'),other=e.parent===key?e.child:e.parent,b=el('button',byKey.get(other)?.title||other);b.onclick=()=>show(other);card.append(b,el('p',e.statement||e.relation));block(card,'关系来源与字段',e);detail.append(card)}heading('精确存储记录');detail.append(el('p',n.node_code,'muted'));block(detail,'Knowledge版本详情',n.database);block(detail,'本例节点完整信息',n)}
function render(){tree.replaceChildren();const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;const visible=new Set(D.nodes.filter(n=>(!f||n.patient_evidence.status===f)&&(!q||JSON.stringify(n).toLowerCase().includes(q))).map(n=>n.key));for(const key of [...visible]){let p=byKey.get(key).parent;while(p){visible.add(p);p=byKey.get(p).parent}}function branch(n){const li=el('li'),b=el('button',n.title,'node'+(active===n.key?' active':''));b.append(badge(n.patient_evidence.status));b.onclick=()=>show(n.key);const children=D.nodes.filter(c=>c.parent===n.key&&visible.has(c.key));if(children.length){const d=el('details'),s=el('summary'),ul=el('ul');d.open=true;s.append(b);children.forEach(c=>ul.append(branch(c)));d.append(s,ul);li.append(d)}else li.append(b);return li}const ul=el('ul');D.nodes.filter(n=>n.parent===null&&visible.has(n.key)).forEach(n=>ul.append(branch(n)));tree.append(ul)}
function overview(){active=null;render();detail.replaceChildren();detail.append(el('h2','病例总览 · '+C.sample),el('p',C.case_code,'muted'));if(C.supplement_persistence==='local_files_pending_database')detail.append(el('p','接入预览：SegMAN及人口学/视觉观察已核验，新增记录尚未同步数据库。'));heading('已有执行记录');detail.append(el('p','3项SLOctolyzer模型 + 4项测量算法，CPU串行；FairCLIP复用本例既有输出。'));const rows=[];for(const [task,r] of Object.entries(C.results)){const m=r.observation.measurement;if(m)rows.push({name:task,value:m.value,unit:m.unit,missing_reason:m.unavailable_reason})}metrics(detail,rows);heading('图像与分割结果');const images=el('div',undefined,'pictures');['input','vessel_mask','artery_mask','vein_mask','disc_mask','segman_overlay','segman_cup','segman_rim','segman_disc'].forEach(k=>picture(images,k));detail.append(images);heading('全部节点进度');for(const [s,count] of Object.entries(D.observation_summary))detail.append(el('p',s+'：'+count));acquisitionOverview();heading('图与判读');detail.append(el('p','本页绑定实测观察和来源。组织关系用于导航，技术关系记录产物依赖；医学关系的支持/反驳仍需逐项判读规则。'));block(detail,'FairCLIP既有结果',C.fairclip);block(detail,'完整工具执行记录',C.results);if(C.supplement){heading('新增杯盘测量');metrics(detail,byKey.get('CUP_RIM_MEASURE').patient_evidence.results);block(detail,'人口学、视觉观察及SegMAN来源',C.supplement);}block(detail,'病例图数据库记录',D.case_graph_artifact);block(detail,'全部关系',D.relationships);block(detail,'知识版本与发布状态',D.records);detail.append(el('p','快照摘要：'+D.checksum,'muted'))}
for(const s of Object.keys(D.observation_summary)){const o=el('option',s);o.value=s;document.getElementById('filter').append(o)}
document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;document.getElementById('overview').onclick=overview;document.getElementById('expand').onclick=()=>tree.querySelectorAll('details').forEach(d=>d.open=true);document.getElementById('collapse').onclick=()=>tree.querySelectorAll('details').forEach(d=>d.open=false);document.getElementById('download').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'})),a=el('a');a.href=u;a.download='case-evidence-data_06231.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
document.getElementById('summary').textContent=D.nodes.length+'节点 · '+C.artifacts.length+'项产物引用 · '+D.exported_at;overview();
</script></body></html>
