<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; connect-src 'none'">
<title>__TITLE__</title>
<style>
:root{color-scheme:light;--ink:#203345;--line:#d7e1e9;--blue:#125d82;--muted:#526576}
*{box-sizing:border-box}body{margin:0;font:15px/1.7 system-ui,sans-serif;color:var(--ink);background:#f2f6fa}
header{padding:28px 32px 20px;background:#153c50;color:white}h1{font-size:26px;margin:0 0 10px}header p{margin:5px 0;max-width:1100px}.pill{display:inline-block;padding:2px 9px;border-radius:12px;background:#e9eff5;color:#38536c;font-size:12px;margin:0 5px}
.warning{background:#fff1cc;color:#694f0b;padding:12px 32px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--line);background:white}input{min-width:230px;flex:1}input,select,button{font:inherit;border:1px solid #a5b8c7;border-radius:7px;padding:7px 11px;background:white;color:var(--ink)}button{cursor:pointer}button:hover,button:focus-visible{background:#e8f3fa;outline:2px solid #4785a3}main{display:grid;grid-template-columns:minmax(310px,42%) minmax(0,58%);min-height:70vh}nav{padding:15px 12px;max-height:80vh;overflow:auto;border-right:1px solid var(--line)}article{padding:22px 28px;background:white;overflow-wrap:anywhere;max-height:80vh;overflow:auto}ul{list-style:none;padding-left:19px;margin:4px 0;border-left:1px solid #c8d9e4}nav>ul{border:0;padding-left:0}li{margin:5px 0}summary{cursor:pointer}.node{border:0;text-align:left;background:transparent;padding:3px 6px;font-size:14px}.node.active{background:#d7ebf5;font-weight:700}.type{font-size:10px;font-weight:600;border-radius:3px;padding:2px 5px;margin-right:5px;background:#edf2f6}.GOAL{background:#244d6b;color:white}.EVIDENCE{background:#d8eafb}.TOOL{background:#dcf1e2}.DATA{background:#eee2f9}.QC{background:#ffe8c7}h2{font-size:22px;margin:0 0 12px}h3{font-size:17px;border-bottom:1px solid var(--line);padding-bottom:5px;margin-top:24px}.card{border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0;background:#fcfdff}.meta{font-size:12px;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#f2f5f8;border-radius:6px;padding:12px;max-height:440px;overflow:auto}a{color:var(--blue)}.missing{color:#935115}.note{color:var(--muted)}#count{margin-left:auto;font-size:13px;align-self:center}details>summary{color:var(--blue)}.badge{font-size:12px;color:#695713;background:#fff2d2;padding:2px 5px}footer{padding:14px 30px;font-size:12px;color:var(--muted)}@media(max-width:800px){main{display:block}nav{max-height:45vh;border-bottom:1px solid var(--line)}article{max-height:none;padding:20px}header{padding:22px}h1{font-size:22px}}@media print{.toolbar,nav{display:none}main{display:block}article{max-height:none;overflow:visible}details{display:block}}
</style>
</head>
<body>
<header><h1>__TITLE__</h1><p>从需求找到来源，从工具找到输入；每个节点都能展开查看精确记录。</p><p id="summary"></p></header>
<div class="warning">当前为 Draft 取证计划，不是已经完成的患者医学证据图。树线表示组织关系，不自动代表因果或支持。数值权重仍在讨论，缺失值不是零分。</div>
<section class="toolbar" aria-label="浏览控制"><input id="search" aria-label="搜索节点" placeholder="搜索名称、编号、工具、缺项…"><select id="type" aria-label="节点类型"><option value="">全部类型</option><option>GOAL</option><option>EVIDENCE</option><option>DATA</option><option>TOOL</option><option>QC</option></select><button id="expand">展开全部</button><button id="collapse">折叠全部</button><button id="overview">总览 / 来源 / 分数</button><button id="download">下载完整快照 JSON</button><span id="count"></span></section>
<main><nav id="tree" aria-label="证据需求树"></nav><article id="detail" aria-live="polite"></article></main>
<footer>离线只读快照，无外部脚本、无数据库凭据、不会调用模型或发布知识。文件生成后不会自动反映撤回；再次导出以核对最新状态。原始对象保留在对象存储，网页展示其引用与有界片段。</footer>
<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('snapshot').textContent);
const detail=document.getElementById('detail'), tree=document.getElementById('tree');
const byKey=new Map(D.nodes.map(n=>[n.key,n]));let active=null;
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function jsonBlock(parent,label,value){const d=el('details'),s=el('summary',label);d.append(s,el('pre',JSON.stringify(value,null,2)));parent.append(d)}
function heading(text){detail.append(el('h3',text))}
function link(parent,label,url){try{const u=new URL(url);if(u.protocol!=='https:')return;const a=el('a',label);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';parent.append(a)}catch{}}
function sourceCard(p){
 const card=el('section',undefined,'card');
 card.append(el('strong',p.title),el('p',p.binding.interpretation));link(card,'打开原网页',p.url);
 const indexed=p.index.status==='indexed';
 card.append(el('p','医学教育网页 · 已归档 · '+(indexed?'已切块/索引':'身份候选待核对，未建索引')+' · 未发布医学规则',indexed?'meta':'missing'));
 const selected=indexed?p.chunks.filter(c=>c.text.length>100&&p.binding.terms.some(t=>c.text.toLowerCase().includes(t))):p.preview_blocks_not_indexed_evidence;
 for(const c of selected){const d=el('details');d.append(el('summary',(indexed?'原文Chunk':'归档正文预览（不是检索Chunk）')+' · '+c.position.kind+' #'+c.position.ordinal),el('p',c.text));jsonBlock(d,'精确位置 / 引用',c);card.append(d)}
 jsonBlock(card,'来源、抓取、索引完整记录',p);return card;
}
function nodeClick(key){active=key;renderTree();const n=byKey.get(key);detail.replaceChildren();detail.append(el('h2',n.title),el('p',n.node_code,'meta'));const facts=el('p');facts.append(el('span',n.node_type,'pill'),el('span',n.database.status,'pill'),el('span',n.database.withdrawn?'已撤回':'未撤回（导出时）','pill'));detail.append(facts);detail.append(el('p',n.gap?'当前缺项：'+n.gap:'此节点未登记具体缺项；不等于已获得患者证据。',n.gap?'missing':'note'));heading('来源与适用边界');for(const id of n.egs_sources){detail.append(sourceCard(D.egs_pages.find(p=>p.id===id)))}for(const e of n.knowledge){const card=el('section',undefined,'card');card.append(el('strong',e.kind),el('p',e.scope||''));if(e.chunk_ref){const c=D.source_chunks.find(c=>c.ref.checksum===e.chunk_ref.checksum);if(c)card.append(el('p',c.text))}if(e.page_id){const p=D.historical_pages.find(p=>p.id===e.page_id);if(p){link(card,'打开旧页面来源',p.url);jsonBlock(card,'历史页面片段（并非本轮SourceVersion）',p)}}jsonBlock(card,'精确绑定',e);detail.append(card)}if(!n.knowledge.length&&!n.egs_sources.length)detail.append(el('p','无医学文献绑定；请查看工具/工程来源与缺项。','missing'));heading('工具与工程来源');jsonBlock(detail,'该节点工具绑定',n.tools);jsonBlock(detail,'工程规则/源码来源（不等于医学依据）',D.engineering);heading('连接到的节点');for(const e of D.relationships.filter(e=>e.parent===key||e.child===key)){const card=el('section',undefined,'card');const text=e.parent+' → '+e.child+' · '+e.relation;const b=el('button',text);b.onclick=()=>nodeClick(e.parent===key?e.child:e.parent);card.append(b,el('p',e.statement||'组织/技术关系；不是自动医学因果。'));jsonBlock(card,'关系的全部字段与来源',e);detail.append(card)}heading('评分与病例观察');detail.append(el('p','医学权重：尚未设定。LLM研究判断、模型原始分数、患者支持度和完整度应分栏，不混算。'));jsonBlock(detail,'当前分数状态',n.medical_score);if(D.historical_case.node_key===key){detail.append(el('p','以下仅是已有单例历史模型观察；不是本次执行，不会赋予其他节点患者证据。','badge'));jsonBlock(detail,'历史Runtime/Artifact绑定',D.historical_case)}heading('数据库中的全部字段');for(const r of D.records.filter(s=>s.record.code===n.node_code||s.record.node_ref?.code===n.node_code||s.record.code==='CONCEPT:GLAUCOMA:'+key)){jsonBlock(detail,r.record.kind+' · '+r.record.version,r)}jsonBlock(detail,'节点完整视图',n)}
function renderTree(){tree.replaceChildren();const q=document.getElementById('search').value.toLowerCase(),type=document.getElementById('type').value;const matches=new Set(D.nodes.filter(n=>(!type||n.node_type===type)&&(!q||JSON.stringify(n).toLowerCase().includes(q))).map(n=>n.key));const visible=new Set(matches);for(const key of matches){let p=byKey.get(key).parent;while(p){visible.add(p);p=byKey.get(p).parent}}document.getElementById('count').textContent=matches.size+' / '+D.nodes.length+' 节点';function branch(n){const li=el('li'),button=el('button',undefined,'node'+(n.key===active?' active':''));button.append(el('span',n.node_type,'type '+n.node_type),el('span',n.title));button.onclick=()=>nodeClick(n.key);const children=D.nodes.filter(c=>c.parent===n.key&&visible.has(c.key));if(children.length){const d=el('details'),s=el('summary');d.open=true;s.append(button);d.append(s);const ul=el('ul');children.forEach(c=>ul.append(branch(c)));d.append(ul);li.append(d)}else li.append(button);return li}const ul=el('ul');D.nodes.filter(n=>n.parent===null&&visible.has(n.key)).forEach(n=>ul.append(branch(n)));tree.append(ul)}
function overview(){detail.replaceChildren();detail.append(el('h2','全图总览'),el('p','52个节点是取证计划。原Knowledge记录与来源在导出时精确读回；不是患者已确认诊断。'));heading('三种不同的连接');for(const [label,prefix] of [['组织树（不能按AND/OR直接算分）','organizes:'],['原数据库技术边','technical:'],['研究医学关联（未转为正式SUPPORTS/REFUTES）','research:']]){detail.append(el('p',label+'：'+D.relationships.filter(e=>e.id.startsWith(prefix)).length))}heading('新增EGS来源');D.egs_pages.forEach(p=>detail.append(sourceCard(p)));heading('数值评分方案仍待确定');detail.append(el('p','现有03引擎负责受控状态传播及证据计数。尚没有获批的LLM数值权重传播公式；不把模型分数当校准疾病概率，不把缺项记零分。'));jsonBlock(detail,'评分分层与当前实现边界',D.score_policy);heading('其他已有测量算法');jsonBlock(detail,'算法目录历史核对',D.additional_algorithms);heading('完整数据与精确引用');jsonBlock(detail,'全部Knowledge记录',D.records);jsonBlock(detail,'全部关系',D.relationships);jsonBlock(detail,'历史病例观察（未在本轮重新运行）',D.historical_case);detail.append(el('p','快照摘要：'+D.checksum,'meta'))}
document.getElementById('search').oninput=renderTree;document.getElementById('type').onchange=renderTree;document.getElementById('expand').onclick=()=>tree.querySelectorAll('details').forEach(d=>d.open=true);document.getElementById('collapse').onclick=()=>tree.querySelectorAll('details').forEach(d=>d.open=false);document.getElementById('overview').onclick=overview;document.getElementById('download').onclick=()=>{const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),a=el('a');a.href=URL.createObjectURL(b);a.download='glaucoma-evidence-snapshot.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById('summary').textContent=D.nodes.length+' 节点 · '+D.relationships.length+' 展示关系 · '+D.records.length+' 条精确数据库记录 · 导出时间 '+D.exported_at;renderTree();overview();
</script>
</body></html>
