</style></head><body>
<header><h1>__TITLE__</h1><div id="summary"></div><div>来源事实 → 提炼理由 → 取证需求 → 工具结果 → 判读 → 计算依赖与判读背景</div></header>
<div class="toolbar"><input id="search" placeholder="搜索节点或取证内容" aria-label="搜索节点"><select id="filter" aria-label="状态筛选"><option value="">全部状态</option></select><button id="overview">全图总览</button><button id="criteria">判读条件与逐级回传</button><button id="expand">展开全部</button><button id="collapse">折叠全部</button></div>
<div id="structure-navigation" class="structure-navigation" aria-label="证据与结果分类" hidden></div>
<main><nav id="tree" aria-label="证据树"></nav><article id="detail" aria-live="polite"></article></main>
<footer>原文链接可打开查阅；精确引用保存在数据库和配套数据文件中。本页展示导出时的结果，不会运行模型。</footer>
<script id="snapshot" type="application/json">__SNAPSHOT__</script>
<script id="explanations" type="application/json">__EXPLANATIONS__</script>
<script id="presentation" type="application/json">__PRESENTATION__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('snapshot').textContent),E=JSON.parse(document.getElementById('explanations').textContent),C=D.case_evidence,S=D.evidence_structure;
const P=JSON.parse(document.getElementById('presentation').textContent);
const tree=document.getElementById('tree'),detail=document.getElementById('detail'),byKey=new Map(D.nodes.map(n=>[n.key,n]));let active=null,viewGroup='main';
const groupLabels={main:'医学判读主树',dependency:'计算与解释依赖',deferred:'待补检查',auxiliary:'辅助与探索结果'};
const roleLabels={clinical_requirement:'医学判读需求',computation_dependency:'计算依赖',interpretation_context:'判读背景',deferred_check:'待补检查',exploratory_result:'辅助与探索结果'};
const relationLabels={organizes_source_backed_criteria:'归纳有来源的判读条件',measurement_input:'测量输入',interpretation_modifier:'判读背景',validity_check:'结果有效性检查'};
if(D.source_associations){
 groupLabels.main='医学判读与文献关联';roleLabels.research_association='文献关联取证';
 Object.assign(relationLabels,{organizes_source_association:'文献支持的取证主题',association_measurement_input:'复用输入或测量',population_association:'人群统计关联',morphological_association:'形态关联',cross_modal_consistency:'结构功能对应',interpretation_context:'解释背景'});
}
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function heading(text){const h=el('h3',text);if(text==='4 · 本例工具与观察结果')h.id='measurement-section';detail.append(h);if(text==='3 · 本节点的取证需求')modelChoice(active)}
function number(x){return x==null?'未测得':Number(x).toFixed(4).replace(/0+$/,'').replace(/\.$/,'')}
function diseaseCriteriaOnly(){return D.research_criteria?.schema==='case-research-criteria/1.3.0'}
function displayStatus(s){return ['已有观察·判读不确定','已有观察'].includes(s)?'已有结果':s}
function observationCounts(){const counts={};for(const [s,n] of Object.entries(D.observation_summary||{})){const label=displayStatus(s);counts[label]=(counts[label]||0)+n}return counts}
function criterionObservationCounts(){const counts={},labels={met:'满足条件',not_met:'未满足条件',not_observed:'未观察到所定义现象',unavailable:'当前输入无法取证'};const unique=new Map(D.research_criteria.results.map(r=>[r.criterion_id,r]));for(const r of unique.values()){const label=labels[r.comparison]||r.comparison;counts[label]=(counts[label]||0)+1}return counts}
function observationOverview(){heading('当前输入下的取证安排');if(S){const counts=criterionObservationCounts(),total=Object.values(counts).reduce((a,b)=>a+b,0);detail.append(el('p','共'+total+'条判读条件，按条件统计一次。'));for(const [label,count] of Object.entries(counts))detail.append(el('p',label+'：'+count+'条判读条件'))}else{for(const [s,count] of Object.entries(observationCounts()))detail.append(el('p',s+'：'+count+'个节点'))}}
function descriptiveResults(key){
 const R=D.research_criteria;if(!diseaseCriteriaOnly())return;
 const ids=R.descriptive_node_summaries?.[key]?.criterion_ids||[];
 for(const id of ids){
  if(D.case_completion&&id==='FOVEA')continue;
  const rule=(R.descriptive_criteria||R.policy.descriptive_criteria||R.policy.criteria).find(x=>x.id===id);
  const r=R.descriptive_results.find(x=>x.criterion_id===id);if(!rule||!r)continue;
  if(S?.node_roles[key]?.group==='main'&&!mainDescendants(key).has(rule.leaf))continue;
  const card=el('section',undefined,'card descriptive-card');
  card.append(el('h4',rule.title),el('p','本例结果：'+r.display_result),el('p','结果说明：'+r.assessment));
  const more=el('details');more.append(el('summary','计算方法与来源'));
  if(r.applicability_note)more.append(el('p',r.applicability_note));
  for(const s of rule.sources||[]){const row=el('div');link(row,s.title+' ↗',s.url);more.append(row)}
  card.append(more);detail.append(card);
 }
}
function criteria(key){
 const R=D.research_criteria;if(!R)return;
 const ids=R.node_summaries[key]?.criterion_ids||[];
 if(!ids.length){if(diseaseCriteriaOnly()&&!S)detail.append(el('p','本节点结果用于测量或背景记录，无独立疾病判读条件。'));return}
 if(!['case-research-criteria/1.2.0','case-research-criteria/1.3.0'].includes(R.schema))detail.append(el('p','条件沿路径下传，结果按原路径返回；同源测量只记一次。'));
 for(const id of ids){
  const rule=R.policy.criteria.find(x=>x.id===id),r=R.results.find(x=>x.criterion_id===id);
  const card=el('section',undefined,'card criterion-card');
  if(r.display_result!==undefined){
   card.append(el('h4',rule.title),el('p','检查参照：'+rule.condition),el('p','本例结果：'+r.display_result),el('p','判读：'+r.assessment));
   if(r.review_ref)card.append(el('p','观察者：本轮助手（实际看图，代替后续VLM）','muted'));
   const more=el('details');more.append(el('summary','方法、来源与取证路径'));
   if(r.applicability_note)more.append(el('p',r.applicability_note));
   more.append(el('p',r.path.map(k=>byKey.get(k)?.title||k).join(' → ')));
   for(const s of rule.sources){const row=el('div');link(row,s.title+' ↗',s.url);more.append(row)}
   if(!rule.sources.length)more.append(el('p','检查依据见本页来源事实；计算方法及输入见工具结果。'));
   card.append(more);
   if(key!==rule.leaf){const b=el('button','查看结果：'+(byKey.get(rule.leaf)?.title||rule.leaf)+' →');b.onclick=()=>show(rule.leaf);card.append(b)}
   detail.append(card);continue;
  }
  card.append(el('h4',rule.title),el('p','判读条件：'+rule.condition));
  if(rule.expected_pattern)card.append(el('p','要寻找的表现：'+rule.expected_pattern));
  if(r.value!==null)card.append(el('p','本例数值：'+number(r.value)+(rule.unit==='1'?'（无量纲）':'')));
  if(r.distance_to_reference!=null)card.append(el('p','与参考值的差：'+number(r.distance_to_reference)));
  if(r.equivalent_diameter_ratio!=null)card.append(el('p','面积占比：'+number(r.value*100)+'%；等面积直径比：'+number(r.equivalent_diameter_ratio)));
  const labels={met:'达到偏大特征参照',not_met:'未达到偏大特征参照',unavailable:'当前不能判定',reference_only:'保留背景测量',above_geometric_reference:'达到粗略几何参照（非医学切点）',below_geometric_reference:'低于粗略几何参照（非医学切点）'};
  card.append(el('p','本例对照：'+labels[r.comparison]+(r.reason?'；'+r.reason:'')));
  if(r.observation)card.append(el('p','实际观察：'+r.observation));
  if(r.interpretation_rule)card.append(el('p','如何用于取证：'+r.interpretation_rule));
  card.append(el('p','方法说明：'+r.applicability_note,'muted'));
  const path=el('details',undefined,'criterion-path');path.append(el('summary','查看条件下传 / 结果回传路径'),el('p',r.path.map(k=>byKey.get(k)?.title||k).join(' → ')),el('p',[...r.path].reverse().map(k=>byKey.get(k)?.title||k).join(' → ')));card.append(path);
  const sourcesBox=el('div',undefined,'criterion-sources');sourcesBox.append(el('strong','文献来源'));
  for(const source of rule.sources){const sourceRow=el('div',undefined,'source-row');link(sourceRow,source.title+' ↗',source.url);sourceRow.append(el('p',source.fact,'muted'));sourcesBox.append(sourceRow)}
  card.append(sourcesBox);
  const actions=el('div',undefined,'criterion-actions');
  if(key===rule.leaf){actions.append(el('span','你当前就在该测量节点','muted'))}
  else {const b=el('button','前往测量：'+(byKey.get(rule.leaf)?.title||rule.leaf)+' →');b.onclick=()=>show(rule.leaf);actions.append(b)}
  card.append(actions);detail.append(card);
 }
}
function completionDetails(key){
 const R=D.case_completion;if(!R)return;
 const tasks=key==='CUP_RIM_MEASURE'?['rim']:(['DISC_GEOMETRY','DISC_MASK','ALTERNATIVES'].includes(key)?['ellipse']:[]);
 for(const task of tasks){
  const item=R.geometry[task],m=item.record.measurement,box=el('section',undefined,'card');
  box.append(el('h4',task==='rim'?'盘沿方向宽度与分布':'视盘椭圆度与方向'),el('p','算法：'+item.tool_code+' · '+item.version));detail.append(box);
  if(task==='rim'){
   metrics([{name:'有效方向/全部方向',value:m.valid_rays+'/360'},
    {name:'最窄盘沿宽度',value:m.minimum_width.rim_width_px,unit:'px'},
    {name:'最小盘沿/同轴盘径',value:m.minimum_normalized_width.width_over_same_axis_disc_diameter,unit:'1'}]);
   const names={up:'图像上方',down:'图像下方',left:'图像左方',right:'图像右方'};
   for(const [k,s] of Object.entries(m.image_sectors))metrics([
    {name:names[k]+'盘沿宽度中位数',value:s.median_width_px,unit:'px'},
    {name:names[k]+'有效方向',value:s.valid_rays+'/'+s.expected_rays}]);
   detail.append(el('p','图像方向测量已完成；鼻颞解剖方向未定位，所以本次不计算ISNT。'));
  }else{
   metrics([{name:'等效椭圆长轴',value:m.major_axis_px,unit:'px'},{name:'等效椭圆短轴',value:m.minor_axis_px,unit:'px'},
    {name:'短轴/长轴',value:m.minor_over_major,unit:'1'},{name:'长轴/短轴',value:m.major_over_minor,unit:'1'},
    {name:'图像坐标长轴方向',value:m.major_axis_angle_degrees,unit:'°'}]);
   detail.append(el('p','记录二维形状；不是三维倾斜角。相关研究的人群、测量定义与关联方向不同，暂不设统一疾病权重。'));
  }
  const refs=el('details');refs.append(el('summary','公式与研究来源'));
  for(const [name,formula] of Object.entries(item.formula))refs.append(el('p',name+'：'+formula));
  for(const source of item.sources){const row=el('p');link(row,source.relation+' ↗',source.url);refs.append(row)}detail.append(refs);
 }
 for(const o of R.visual_observations.filter(x=>x.nodes.includes(key))){
  const card=el('section',undefined,'card visual-review');card.append(el('h4',o.title+' · 已有结果'),
   el('p',o.observation),el('p',o.use),el('p','方法：本轮助手实际看图，代替拟接入的VLM。','muted'));
  const refs=el('details');refs.append(el('summary','观察依据与来源'));for(const url of o.sources){const row=el('p');link(row,'来源网页 ↗',url);refs.append(row)}card.append(refs);detail.append(card);
 }
 if(['FOVEA_LOCATION','FOVEA_MAP','TASK_FOVEA'].includes(key)){
  const old=el('details');old.append(el('summary','查看历史模型候选（本次不采用）'),
   el('p','原模型坐标：'+(R.fovea.model_candidate_xy?.join(', ')||'未提供')+'；本轮视觉定位：未能定位。'));
  picture(old,'fovea_position');detail.append(old);
 }
}
function associationDetails(key){
 const A=D.source_associations;if(!A)return;
 const rows=A.association_edges.filter(e=>key==='ROOT'||e.from===key||mainDescendants(key).has(e.from));
 for(const r of rows){
  const card=el('section',undefined,'card association-card');
  const newReading=vascularItem(r.from);
  const reading=newReading?{reference:newReading.reference,observed:newReading.observed,assessment:newReading.interpretation+' 待补：'+newReading.remaining}:P.nodes[r.from].association;
  card.append(el('h4',byKey.get(r.from).title),el('p','检查参照：'+reading.reference),
   el('p','本例结果：'+reading.observed),el('p','判读：'+reading.assessment));
  if(r.counter_source_ids.length)card.append(el('p','同时保留未检出显著差异的研究，供后续证据强度评估。'));
  const more=el('details');more.append(el('summary','查看文献与测量路径'));structureSources(more,r.sources);
  for(const d of A.dependency_edges.filter(e=>e.to===r.from))targetButton(more,d.from,'输入/结果：');
  card.append(more);if(key!==r.from)targetButton(card,r.from,'查看关联：');detail.append(card);
 }
}
function associationOverview(){
 const A=D.source_associations;if(!A)return;
 heading('本次新增的文献关联分支');
 detail.append(el('p','新增'+A.counts.added_nodes+'个节点、'+A.counts.medical_associations+'项医学关联、'+A.counts.input_links+'条输入/结果引用。原10项判读条件保留，关联不重复计作独立患者证据。'));
 for(const n of A.nodes){const row=el('p');targetButton(row,n.key);row.append(el('span',' · '+status(n)));detail.append(row)}
 toolFlowDetails('ROOT');
}
function toolFlowDetails(key){

 heading(s.schema_version==='case-research-scoring/4.0.0'?'逐项判读补全、来源比较与综合分':s.schema_version==='case-research-scoring/3.0.0'?'全节点评阅、证据充分性与调整分':s.schema_version==='case-research-scoring/2.0.0'?'连续判读、病例综合分与证据移除':'第一版评分与证据移除分析');scoreSummary(s.nodes.ROOT);
 detail.append(el('p','本版：'+s.reviews.length+'项判读记录、'+Object.keys(s.nodes).length+'个节点汇总、'+s.removals.length+'个移除对照。工作评分0—100，非患病概率。'));
 const b=el('button','查看根节点逐项评分与对照');b.onclick=()=>show('ROOT');detail.append(b);
 if(s.adjudications){const counts={};for(const a of s.adjudications){const revised=vascularItem(a.assessment_id.replace('association:',''));const state=revised?(revised.state==='proxy_measured'?'method_mismatch':'reference_missing'):a.state;counts[state]=(counts[state]||0)+1}
  detail.append(el('p','逐项核对：'+s.adjudications.filter(a=>a.review_completed).length+'/'+s.adjudications.length+'；有方向评阅：'+(counts.direction_reviewed||0)+'；方法需对齐：'+(counts.method_mismatch||0)+'；参照待补：'+(counts.reference_missing||0)+'；无法取证：'+(counts.input_missing||0)+'；细节未辨清：'+(counts.ungradable||0)+'。核对完成不等于缺失的检查已经取得。'));
 }
 if(['case-research-scoring/2.0.0','case-research-scoring/3.0.0','case-research-scoring/4.0.0'].includes(s.schema_version)){
  const impacts=s.removals.filter(x=>x.id.startsWith('review:')&&x.confidence_delta!=null&&Math.abs(x.confidence_delta)>1e-10).sort((a,b)=>Math.abs(b.confidence_delta)-Math.abs(a.confidence_delta)).slice(0,5);
  const list=el('div',undefined,'card');list.append(el('h4','对总分影响最大的判读'));
  for(const x of impacts)list.append(el('p',x.title+' → 综合分变化 '+(x.confidence_delta*100).toFixed(2)+'分'));
  if(!impacts.length)list.append(el('p','当前没有改变总分的单项移除。'));
  detail.append(list);
 }
const notes=el('details',undefined,'card');notes.append(el('summary','评分方法与用途'));
 for(const note of s.method_notes)notes.append(el('p',note));
 if(s.sensitivity)notes.append(el('p','风险背景参数敏感性区间：'+s.sensitivity.risk_support.map(scoreNumber).join(' — ')+'；各已知维度±0.10，不是统计置信区间。'));
 detail.append(notes);
}
